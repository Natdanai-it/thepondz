<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"><title>Notebook CPU suffix groups</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06152f"/><stop offset=".55" stop-color="#0b2b5c"/><stop offset="1" stop-color="#041027"/></linearGradient>
 <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#2e72ff"/><stop offset="1" stop-color="#86b8ff"/></linearGradient>
 <linearGradient id="cyan" x1="0" x2="1"><stop offset="0" stop-color="#35d7ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
 <linearGradient id="green" x1="0" x2="1"><stop offset="0" stop-color="#26b98b"/><stop offset="1" stop-color="#8cf0cc"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#dda12a"/><stop offset="1" stop-color="#ffd875"/></linearGradient>
 <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#dce7f5"/><stop offset=".5" stop-color="#7f91aa"/><stop offset="1" stop-color="#f3f8ff"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001027" flood-opacity=".55"/></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a6c9ff" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="640" rx="34" fill="url(#bg)"/><rect width="1200" height="640" rx="34" fill="url(#grid)"/>
<circle cx="1050" cy="80" r="245" fill="#2e72ff" opacity=".10"/><circle cx="110" cy="590" r="240" fill="#35d7ff" opacity=".055"/>

<text x="600" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#dceaff">NOTEBOOK CPU POWER CLASS</text>
<g filter="url(#shadow)"><rect x="105" y="170" width="290" height="300" rx="32" fill="#0a1e3c" stroke="#70aaff" stroke-opacity=".45"/><rect x="455" y="140" width="290" height="330" rx="32" fill="#0b244a" stroke="#70aaff" stroke-opacity=".55"/><rect x="805" y="110" width="290" height="360" rx="32" fill="#0d2d58" stroke="#70aaff" stroke-opacity=".65"/></g>
<text x="250" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="74" font-weight="700" fill="#72e0bd">U</text><text x="600" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="74" font-weight="700" fill="#86b8ff">H</text><text x="950" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#ffc857">HX</text>
<text x="250" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#b9c9df">Efficiency</text><text x="600" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#b9c9df">Performance</text><text x="950" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#b9c9df">High Performance</text>
<text x="250" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8299bb">Battery / Mobility</text><text x="600" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8299bb">Creator / Gaming</text><text x="950" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8299bb">Heavy Workload</text>
</svg>