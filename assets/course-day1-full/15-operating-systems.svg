<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"><title>Operating system families</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06152f"/><stop offset=".55" stop-color="#0b2b5c"/><stop offset="1" stop-color="#041027"/></linearGradient>
 <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#2e72ff"/><stop offset="1" stop-color="#86b8ff"/></linearGradient>
 <linearGradient id="cyan" x1="0" x2="1"><stop offset="0" stop-color="#35d7ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
 <linearGradient id="green" x1="0" x2="1"><stop offset="0" stop-color="#26b98b"/><stop offset="1" stop-color="#8cf0cc"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#dda12a"/><stop offset="1" stop-color="#ffd875"/></linearGradient>
 <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#dce7f5"/><stop offset=".5" stop-color="#7f91aa"/><stop offset="1" stop-color="#f3f8ff"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001027" flood-opacity=".55"/></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a6c9ff" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="640" rx="34" fill="url(#bg)"/><rect width="1200" height="640" rx="34" fill="url(#grid)"/>
<circle cx="1050" cy="80" r="245" fill="#2e72ff" opacity=".10"/><circle cx="110" cy="590" r="240" fill="#35d7ff" opacity=".055"/>

<text x="600" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#dceaff">OPERATING SYSTEMS</text>
<g filter="url(#shadow)"><rect x="80" y="170" width="240" height="300" rx="30" fill="#0a1d3c" stroke="#76afff" stroke-opacity=".45"/><rect x="360" y="170" width="240" height="300" rx="30" fill="#0a1d3c" stroke="#76afff" stroke-opacity=".45"/><rect x="640" y="170" width="240" height="300" rx="30" fill="#0a1d3c" stroke="#76afff" stroke-opacity=".45"/><rect x="920" y="170" width="240" height="300" rx="30" fill="#0a1d3c" stroke="#76afff" stroke-opacity=".45"/></g>
<text x="200" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#86b8ff">Windows 11</text><text x="480" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#86b8ff">Windows Server</text><text x="760" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#72e0bd">Linux</text><text x="1040" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#d0ddf0">macOS</text>
<g fill="#4f8cff"><rect x="150" y="300" width="100" height="100" rx="9"/><path d="M150 350h100M200 300v100" stroke="#eaf4ff" stroke-width="6"/></g>
<g fill="#19385f"><rect x="430" y="300" width="100" height="100" rx="12"/><path d="M450 327h60M450 350h60M450 373h60" stroke="#86b8ff" stroke-width="7" stroke-linecap="round"/></g>
<circle cx="760" cy="350" r="52" fill="#111f31" stroke="#72e0bd" stroke-width="5"/><circle cx="1040" cy="350" r="52" fill="#dce4ee"/>
</svg>