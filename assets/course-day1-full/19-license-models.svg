<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"><title>Software license models</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06152f"/><stop offset=".55" stop-color="#0b2b5c"/><stop offset="1" stop-color="#041027"/></linearGradient>
 <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#2e72ff"/><stop offset="1" stop-color="#86b8ff"/></linearGradient>
 <linearGradient id="cyan" x1="0" x2="1"><stop offset="0" stop-color="#35d7ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
 <linearGradient id="green" x1="0" x2="1"><stop offset="0" stop-color="#26b98b"/><stop offset="1" stop-color="#8cf0cc"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#dda12a"/><stop offset="1" stop-color="#ffd875"/></linearGradient>
 <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#dce7f5"/><stop offset=".5" stop-color="#7f91aa"/><stop offset="1" stop-color="#f3f8ff"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001027" flood-opacity=".55"/></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a6c9ff" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="640" rx="34" fill="url(#bg)"/><rect width="1200" height="640" rx="34" fill="url(#grid)"/>
<circle cx="1050" cy="80" r="245" fill="#2e72ff" opacity=".10"/><circle cx="110" cy="590" r="240" fill="#35d7ff" opacity=".055"/>

<text x="600" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#dceaff">SOFTWARE LICENSE MODELS</text>
<g filter="url(#shadow)"><rect x="65" y="150" width="325" height="165" rx="28" fill="#0a1d3c" stroke="#6fa8ff" stroke-opacity=".38"/><rect x="445" y="150" width="325" height="165" rx="28" fill="#0a1d3c" stroke="#6fa8ff" stroke-opacity=".38"/><rect x="825" y="150" width="325" height="165" rx="28" fill="#0a1d3c" stroke="#6fa8ff" stroke-opacity=".38"/><rect x="65" y="360" width="325" height="165" rx="28" fill="#0a1d3c" stroke="#6fa8ff" stroke-opacity=".38"/><rect x="445" y="360" width="325" height="165" rx="28" fill="#0a1d3c" stroke="#6fa8ff" stroke-opacity=".38"/><rect x="825" y="360" width="325" height="165" rx="28" fill="#0a1d3c" stroke="#6fa8ff" stroke-opacity=".38"/></g>
<text x="228" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#86b8ff">USER</text><text x="608" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#86b8ff">DEVICE</text><text x="988" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#86b8ff">CONCURRENT</text><text x="228" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#72e0bd">SUBSCRIPTION</text><text x="608" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffc857">PERPETUAL</text><text x="988" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#d5e1f0">OEM</text>
<text x="228" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8ea6c4">per person</text><text x="608" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8ea6c4">per computer</text><text x="988" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8ea6c4">simultaneous use</text><text x="228" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8ea6c4">time based</text><text x="608" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8ea6c4">version rights</text><text x="988" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8ea6c4">with hardware</text>
</svg>