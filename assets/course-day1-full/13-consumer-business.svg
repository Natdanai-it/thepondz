<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"><title>Consumer and business notebooks</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06152f"/><stop offset=".55" stop-color="#0b2b5c"/><stop offset="1" stop-color="#041027"/></linearGradient>
 <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#2e72ff"/><stop offset="1" stop-color="#86b8ff"/></linearGradient>
 <linearGradient id="cyan" x1="0" x2="1"><stop offset="0" stop-color="#35d7ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
 <linearGradient id="green" x1="0" x2="1"><stop offset="0" stop-color="#26b98b"/><stop offset="1" stop-color="#8cf0cc"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#dda12a"/><stop offset="1" stop-color="#ffd875"/></linearGradient>
 <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#dce7f5"/><stop offset=".5" stop-color="#7f91aa"/><stop offset="1" stop-color="#f3f8ff"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001027" flood-opacity=".55"/></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a6c9ff" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="640" rx="34" fill="url(#bg)"/><rect width="1200" height="640" rx="34" fill="url(#grid)"/>
<circle cx="1050" cy="80" r="245" fill="#2e72ff" opacity=".10"/><circle cx="110" cy="590" r="240" fill="#35d7ff" opacity=".055"/>

<text x="600" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#dceaff">CONSUMER vs BUSINESS NOTEBOOK</text>
<g filter="url(#shadow)"><rect x="95" y="155" width="465" height="355" rx="32" fill="#0a1d3c"/><rect x="640" y="155" width="465" height="355" rx="32" fill="#0a1d3c"/></g>
<text x="328" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#86b8ff">CONSUMER</text><text x="872" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#72e0bd">BUSINESS</text>
<g transform="translate(175 255)"><rect width="305" height="165" rx="18" fill="#102b56"/><rect x="22" y="20" width="261" height="115" rx="9" fill="#04142d"/><path d="M0 180h305l45 45H-45z" fill="#abb9cc"/></g>
<g transform="translate(720 255)"><rect width="305" height="165" rx="18" fill="#102b56" stroke="#72e0bd"/><rect x="22" y="20" width="261" height="115" rx="9" fill="#04142d"/><path d="M0 180h305l45 45H-45z" fill="#abb9cc"/></g>
<rect x="165" y="465" width="326" height="48" rx="24" fill="#123769" stroke="#4f8cff" stroke-opacity=".55"/><text x="328.0" y="497" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#eaf3ff">Price / Specs</text><rect x="700" y="465" width="345" height="48" rx="24" fill="#123b58" stroke="#72e0bd" stroke-opacity=".55"/><text x="872.5" y="497" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#eaf3ff">Warranty / Security / Lifecycle</text>
