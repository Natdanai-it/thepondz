<text x="600" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#72e0bd">4 / 8 / 12 / 24 GB</text><text x="945" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffc857">CUDA?</text><text x="945" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9db2ce">Training / Inference</text>
