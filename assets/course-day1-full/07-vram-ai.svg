<rect width="1200" height="640" rx="34" fill="url(#bg)"/><rect width="1200" height="640" rx="34" fill="url(#grid)"/>
<circle cx="1050" cy="80" r="245" fill="#2e72ff" opacity=".10"/><circle cx="110" cy="590" r="240" fill="#35d7ff" opacity=".055"/>

<text x="600" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#dceaff">GPU FOR AI = MODEL + VRAM + SOFTWARE SUPPORT</text>
<g filter="url(#shadow)"><rect x="90" y="170" width="330" height="310" rx="30" fill="#0b1f41" stroke="#7eb8ff" stroke-opacity=".45"/><rect x="435" y="170" width="330" height="310" rx="30" fill="#0b1f41" stroke="#7eb8ff" stroke-opacity=".45"/><rect x="780" y="170" width="330" height="310" rx="30" fill="#0b1f41" stroke="#7eb8ff" stroke-opacity=".45"/></g>
<text x="255" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#8fc0ff">GPU MODEL</text><text x="600" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#8fc0ff">VRAM</text><text x="945" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#8fc0ff">SOFTWARE</text>
