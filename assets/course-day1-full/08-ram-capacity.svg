<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"><title>RAM capacity usage guide</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06152f"/><stop offset=".55" stop-color="#0b2b5c"/><stop offset="1" stop-color="#041027"/></linearGradient>
 <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#2e72ff"/><stop offset="1" stop-color="#86b8ff"/></linearGradient>
 <linearGradient id="cyan" x1="0" x2="1"><stop offset="0" stop-color="#35d7ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
 <linearGradient id="green" x1="0" x2="1"><stop offset="0" stop-color="#26b98b"/><stop offset="1" stop-color="#8cf0cc"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#dda12a"/><stop offset="1" stop-color="#ffd875"/></linearGradient>
 <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#dce7f5"/><stop offset=".5" stop-color="#7f91aa"/><stop offset="1" stop-color="#f3f8ff"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001027" flood-opacity=".55"/></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a6c9ff" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="640" rx="34" fill="url(#bg)"/><rect width="1200" height="640" rx="34" fill="url(#grid)"/>
<circle cx="1050" cy="80" r="245" fill="#2e72ff" opacity=".10"/><circle cx="110" cy="590" r="240" fill="#35d7ff" opacity=".055"/>

<text x="600" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#dceaff">RAM = WORKING SPACE</text>
<g filter="url(#shadow)"><rect x="95" y="180" width="230" height="300" rx="30" fill="#0b1d3c"/><rect x="365" y="155" width="230" height="325" rx="30" fill="#0b2245"/><rect x="635" y="125" width="230" height="355" rx="30" fill="#0b284f"/><rect x="905" y="95" width="200" height="385" rx="30" fill="#0d2f5b"/></g>
<text x="210" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#86b8ff">8 GB</text><text x="480" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#86b8ff">16 GB</text><text x="750" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#72e0bd">32 GB</text><text x="1005" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffc857">64 GB+</text>
<text x="210" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a7b9d3">Basic</text><text x="480" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a7b9d3">Business</text><text x="750" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a7b9d3">Dev / VM / Data</text><text x="1005" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a7b9d3">Workstation</text>
<g fill="#476eaa" opacity=".8"><rect x="120" y="390" width="40" height="42" rx="8"/><rect x="182" y="390" width="40" height="42" rx="8"/><rect x="244" y="390" width="40" height="42" rx="8"/><rect x="306" y="390" width="40" height="42" rx="8"/><rect x="368" y="390" width="40" height="42" rx="8"/><rect x="430" y="390" width="40" height="42" rx="8"/><rect x="492" y="390" width="40" height="42" rx="8"/><rect x="554" y="390" width="40" height="42" rx="8"/><rect x="616" y="390" width="40" height="42" rx="8"/><rect x="678" y="390" width="40" height="42" rx="8"/><rect x="740" y="390" width="40" height="42" rx="8"/><rect x="802" y="390" width="40" height="42" rx="8"/><rect x="864" y="390" width="40" height="42" rx="8"/><rect x="926" y="390" width="40" height="42" rx="8"/><rect x="988" y="390" width="40" height="42" rx="8"/></g>
</svg>