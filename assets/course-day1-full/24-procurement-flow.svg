<g><rect x="165" y="330" width="210" height="48" rx="24" fill="#103358" stroke="#4f8cff" stroke-opacity=".55"/><text x="270.0" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#eaf3ff">MODEL / SKU</text><rect x="495" y="330" width="210" height="48" rx="24" fill="#103358" stroke="#4f8cff" stroke-opacity=".55"/><text x="600.0" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#eaf3ff">LICENSE / TERM</text><rect x="825" y="330" width="210" height="48" rx="24" fill="#103358" stroke="#4f8cff" stroke-opacity=".55"/><text x="930.0" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#eaf3ff">VENDOR / PRICE</text></g>
