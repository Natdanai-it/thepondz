<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"><title>CPU family and generation comparison</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06152f"/><stop offset=".55" stop-color="#0b2b5c"/><stop offset="1" stop-color="#041027"/></linearGradient>
 <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#2e72ff"/><stop offset="1" stop-color="#86b8ff"/></linearGradient>
 <linearGradient id="cyan" x1="0" x2="1"><stop offset="0" stop-color="#35d7ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
 <linearGradient id="green" x1="0" x2="1"><stop offset="0" stop-color="#26b98b"/><stop offset="1" stop-color="#8cf0cc"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#dda12a"/><stop offset="1" stop-color="#ffd875"/></linearGradient>
 <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#dce7f5"/><stop offset=".5" stop-color="#7f91aa"/><stop offset="1" stop-color="#f3f8ff"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001027" flood-opacity=".55"/></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a6c9ff" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="640" rx="34" fill="url(#bg)"/><rect width="1200" height="640" rx="34" fill="url(#grid)"/>
<circle cx="1050" cy="80" r="245" fill="#2e72ff" opacity=".10"/><circle cx="110" cy="590" r="240" fill="#35d7ff" opacity=".055"/>

<g filter="url(#shadow)"><rect x="110" y="155" width="980" height="335" rx="34" fill="#091c39" stroke="#76afff" stroke-opacity=".45"/></g>
<text x="600" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#cfe4ff">CPU MODEL ≠ PERFORMANCE BY NAME ALONE</text>
<g><rect x="165" y="220" width="150" height="48" rx="24" fill="#0a2c5a" stroke="#4f8cff" stroke-opacity=".55"/><text x="240.0" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#eaf3ff">i3</text><rect x="345" y="220" width="150" height="48" rx="24" fill="#0a2c5a" stroke="#4f8cff" stroke-opacity=".55"/><text x="420.0" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#eaf3ff">i5</text><rect x="525" y="220" width="150" height="48" rx="24" fill="#0a2c5a" stroke="#4f8cff" stroke-opacity=".55"/><text x="600.0" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#eaf3ff">i7</text><rect x="705" y="220" width="150" height="48" rx="24" fill="#0a2c5a" stroke="#4f8cff" stroke-opacity=".55"/><text x="780.0" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#eaf3ff">i9</text></g>
<path d="M240 315H780" stroke="url(#blue)" stroke-width="9" stroke-linecap="round"/><path d="M780 315l-24-17v34z" fill="#86b8ff"/>
<text x="510" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#90aacf">Entry → Higher tier within a family</text>
<rect x="205" y="405" width="330" height="54" rx="18" fill="#112d59"/><text x="370" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffcf70">Older i7</text>
<rect x="665" y="405" width="330" height="54" rx="18" fill="#123b58"/><text x="830" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#78e2bf">Newer i5</text>
<path d="M550 432h95" stroke="#86b8ff" stroke-width="7"/><path d="M640 417l24 15-24 15z" fill="#86b8ff"/>
</svg>