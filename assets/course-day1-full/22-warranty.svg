<g transform="translate(900 280)"><circle cx="65" cy="65" r="60" fill="#102b56" stroke="#ffc857" stroke-width="5"/><path d="M65 28v42l30 22" fill="none" stroke="#ffc857" stroke-width="8" stroke-linecap="round"/></g>
