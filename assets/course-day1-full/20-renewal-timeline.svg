<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"><title>Software renewal timeline</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06152f"/><stop offset=".55" stop-color="#0b2b5c"/><stop offset="1" stop-color="#041027"/></linearGradient>
 <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#2e72ff"/><stop offset="1" stop-color="#86b8ff"/></linearGradient>
 <linearGradient id="cyan" x1="0" x2="1"><stop offset="0" stop-color="#35d7ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
 <linearGradient id="green" x1="0" x2="1"><stop offset="0" stop-color="#26b98b"/><stop offset="1" stop-color="#8cf0cc"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#dda12a"/><stop offset="1" stop-color="#ffd875"/></linearGradient>
 <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#dce7f5"/><stop offset=".5" stop-color="#7f91aa"/><stop offset="1" stop-color="#f3f8ff"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001027" flood-opacity=".55"/></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a6c9ff" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="640" rx="34" fill="url(#bg)"/><rect width="1200" height="640" rx="34" fill="url(#grid)"/>
<circle cx="1050" cy="80" r="245" fill="#2e72ff" opacity=".10"/><circle cx="110" cy="590" r="240" fill="#35d7ff" opacity=".055"/>

<text x="600" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#dceaff">LICENSE RENEWAL TIMELINE</text>
<path d="M130 330H1070" stroke="#456a9d" stroke-width="12" stroke-linecap="round"/>
<g fill="#4f8cff"><circle cx="200" cy="330" r="28"/><circle cx="500" cy="330" r="28"/><circle cx="800" cy="330" r="28"/></g><circle cx="1030" cy="330" r="34" fill="#ff7f88"/>
<text x="200" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#86b8ff">START</text><text x="500" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#86b8ff">TRACK</text><text x="800" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#72e0bd">REQUEST QUOTE</text><text x="1030" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ff9da4">EXPIRY</text>
<text x="200" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#91a8c7">Product / Qty</text><text x="500" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#91a8c7">Vendor / Contract</text><text x="800" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#91a8c7">Renew early</text><text x="1030" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#91a8c7">Avoid service stop</text>
</svg>