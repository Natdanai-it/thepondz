<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สไลด์เรียงตาม 10 ขั้น — Pond Classroom</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
.prompt-open{display:inline-block;background:#2357a0;color:white;padding:14px 20px;border-radius:10px;text-decoration:none}

.lesson-figure{margin:24px 0}.lesson-figure img{display:block;width:100%;height:auto;border-radius:14px;cursor:zoom-in}.lesson-figure figcaption{font-size:13px;color:#abbdd5;margin-top:9px}#noteText{white-space:pre-wrap}dialog{padding:20px;background:#07182f;color:white;border:1px solid #4b78ac;max-width:95vw;max-height:95vh}dialog::backdrop{background:rgba(0,0,0,.85)}dialog img{display:block;max-width:90vw;max-height:80vh}dialog button{margin-bottom:12px}

:root{--bg:#020817;--card:#07182f;--line:#233b5c;--ink:#f4f8ff;--muted:#abbdd5;--blue:#94beff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',sans-serif;font-size:18px}button,a{font:inherit}a{color:var(--blue)}button{cursor:pointer;background:#10294d;color:white;border:1px solid var(--line);border-radius:10px;padding:9px 16px}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #ffd477;outline-offset:3px}.bar{display:flex;gap:12px;align-items:center;padding:16px 3vw;border-bottom:1px solid var(--line);flex-wrap:wrap}.brand{font-weight:800;margin-right:auto}.bar a{font-size:14px;text-decoration:none}.bar button{font-size:14px}.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:230px 1fr;gap:24px;padding:24px}nav{max-height:78vh;overflow:auto}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);font-size:13px;margin:3px 0;padding:9px}nav button[aria-current=true]{background:#12305a;color:white}.slide{min-height:630px;padding:38px 44px;background:linear-gradient(135deg,#07182f,#081e3c);border:1px solid var(--line);border-radius:22px}.kicker{color:var(--blue);font-size:14px}h1{font-size:clamp(27px,3.3vw,43px);line-height:1.4;margin:13px 0 8px}h2,h3{margin:0 0 10px}h3{font-size:21px;color:var(--blue)}.subtitle{color:var(--muted);margin:0 0 28px;font-size:19px}.big{font-size:clamp(29px,3.4vw,48px);font-weight:800;line-height:1.5;color:#d0e3ff;margin:30px 0}.lead{font-size:22px;line-height:1.8}p,li{line-height:1.8}li{margin:10px 0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}.cards article{padding:20px 0;border-top:2px solid #3a608d}.cards p{margin:0;color:#d7e2f2}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:17px;line-height:1.7}th{text-align:left;color:var(--blue);background:#0c274b}td,th{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}.flow{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}.flow span{padding:16px;background:#12305a;border-radius:10px;counter-increment:step}.flow span:before{content:counter(step) '. ';color:var(--blue)}.flow{counter-reset:step}pre{font:16px/1.9 monospace;white-space:pre-wrap;background:#020b1a;padding:20px;border-radius:12px}.sources{font-size:12px;margin-top:24px;overflow-wrap:anywhere;color:var(--muted)}.sources a{display:inline-block;margin:4px 10px 4px 0}.controls{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:16px}.controls span{color:var(--muted);font-size:14px}.progress{height:5px;background:#14263f;margin-top:18px;border-radius:5px}.progress i{display:block;height:100%;background:#94beff}aside{margin:18px 0;padding:20px;background:#102440;border-left:4px solid #e9bc6b;color:#f5dfb8;line-height:1.9}aside h2{font-size:17px}.hidden{display:none}.help{font-size:12px;color:var(--muted);padding:10px 0;text-align:center}body.present nav{display:none}body.present .layout{grid-template-columns:1fr;max-width:1500px}body.present .slide{min-height:75vh}.all .slide{margin-bottom:25px}.all .sources{display:block}@media(max-width:900px){.layout{grid-template-columns:1fr;padding:14px}nav{display:none}.slide{padding:24px;min-height:560px}.cards{gap:12px}table{font-size:15px}.bar{padding:12px}.brand{width:100%}}@media(max-width:540px){.cards{grid-template-columns:1fr}.lead{font-size:18px}.slide{padding:20px 16px}td,th{padding:10px}table{min-width:580px}.controls{flex-wrap:wrap}.bar button{padding:7px 10px}}@media print{body{background:white;color:black;font-size:14px}.bar,nav,.controls,.progress,.help,aside{display:none!important}.layout{display:block;padding:0;max-width:none}.slide{display:block!important;break-after:page;min-height:0;border:0;border-radius:0;background:white;padding:1cm;color:black}.slide h1{font-size:26px}.slide .big{font-size:32px}.subtitle,p,td{color:black}.cards p{color:black}th,h3,.kicker{color:#173c70}table{font-size:13px}.sources a{color:#173c70}.hidden{display:block}pre{background:#eee;color:black}@page{size:A4 landscape;margin:10mm}}
.glossary{margin-top:24px;padding:16px;border:1px solid #315680;border-radius:12px}.glossary summary{cursor:pointer;color:#bad5ff}.glossary dl{font-size:16px;line-height:1.8}.glossary dt{font-weight:700;margin-top:12px}.glossary dd{margin-left:0;color:#d7e2f2}select:focus-visible{outline:3px solid #ffd477}</style></head><body><header class="bar"><a class="brand" href="course-deploy-webapp.html">← คอร์สหลัก 10 ขั้น</a><a href="course-claude-code-system-building.html">บทเรียนก่อนหน้า</a><a href="deploy-checklist.html" target="_blank" rel="noopener">เช็กลิสต์ 12 ข้อ</a><a href="codex-supabase-workshop.html" target="_blank" rel="noopener">Prompt สร้างระบบ</a><span style="font-size:12px">รุ่น 2026-10-11-R2</span><label style="font-size:14px">เนื้อหา <select id="level" style="font:inherit;padding:8px;border-radius:8px"><option value="easy">ฉบับอ่านง่าย</option><option value="technical">ผู้สอน / รายละเอียดเทคนิค</option></select></label><button id="notes">คำอธิบายละเอียด</button><button id="all">ดูทุกสไลด์</button><button id="full">เต็มจอ</button><button id="print">พิมพ์ / PDF</button></header><div class="layout"><nav aria-label="สารบัญ" id="toc"></nav><main><div id="screen"></div><div class="controls"><button id="prev">← ก่อนหน้า</button><span id="count" aria-live="polite"></span><button id="next">ถัดไป →</button></div><div class="progress"><i id="progress"></i></div><aside id="note"><h2>คำอธิบายทีละขั้นสำหรับมือใหม่</h2><div id="noteText"></div></aside><div class="help">ใช้ปุ่มลูกศรซ้าย–ขวาเปลี่ยนสไลด์ • N เปิดโน้ต • F เต็มจอ • ข้อมูลปรับ 11 ต.ค. 2569 • คำศัพท์เปิดอ่านได้ใต้เนื้อหา</div></main></div><script src="assets/js/deploy-slides-data.js?v=2026-10-11-R2"></script><script src="assets/js/deploy-beginner-data.js?v=2026-10-11-R2"></script><script src="assets/js/deploy-glossary.js?v=2026-10-11-R2"></script><script>
const technical=new URLSearchParams(location.search).get('mode')==='technical';let data=technical?window.LESSON:window.BEGINNER_LESSON;const screen=document.getElementById('screen'),toc=document.getElementById('toc');let current=Math.max(0,Math.min(data.length-1,Number(location.hash.slice(1))-1||0)),showAll=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function markup(s,i){return `<section class="slide" aria-label="สไลด์ ${i+1}"><div class="kicker">ขั้น ${s.stage}/10 · ${esc(s.stageTitle)} / สไลด์ ${String(i+1).padStart(2,'0')}</div><h1>${esc(s.title)}</h1><p class="subtitle">${esc(s.subtitle)}</p>${s.body}<p><a href="course-deploy-webapp.html#step-${s.stage}">กลับไปลงมือทำขั้น ${s.stage} →</a></p>${window.lessonGlossary(s)}${s.source.length?'<div class="sources">อ้างอิงทางการ: '+s.source.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u.replace('https://',''))}</a>`).join('')+'</div>':''}</section>`}function render(){screen.innerHTML=showAll?data.map(markup).join(''):markup(data[current],current);screen.classList.toggle('all',showAll);document.getElementById('count').textContent=`${current+1} / ${data.length} สไลด์`;document.getElementById('progress').style.width=(current+1)/data.length*100+'%';document.getElementById('prev').disabled=current===0||showAll;document.getElementById('next').disabled=current===data.length-1||showAll;document.getElementById('noteText').textContent=data[current].note;toc.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-current',String(i===current)));history.replaceState(null,'','#'+(current+1));document.getElementById('all').textContent=showAll?'กลับโหมดสไลด์':'ดูทุกสไลด์'}function buildToc(){toc.innerHTML='';data.forEach((s,i)=>{let b=document.createElement('button');b.textContent='ขั้น '+s.stage+' · '+s.title;b.onclick=()=>{current=i;showAll=false;render()};toc.append(b)})}buildToc();const requestedStage=Number(new URLSearchParams(location.search).get('stage'));if(!location.hash&&requestedStage>=1&&requestedStage<=10){current=Math.max(0,data.findIndex(s=>s.stage===requestedStage));}document.getElementById('level').value=technical?'technical':'easy';document.getElementById('level').onchange=e=>{const oldStage=data[current].stage;data=e.target.value==='technical'?window.LESSON:window.BEGINNER_LESSON;const u=new URL(location.href);if(e.target.value==='technical')u.searchParams.set('mode','technical');else u.searchParams.delete('mode');u.searchParams.set('stage',oldStage);u.hash='1';history.replaceState(null,'',u);current=Math.max(0,data.findIndex(s=>s.stage===oldStage));showAll=false;buildToc();render()};function move(n){if(!showAll){current=Math.max(0,Math.min(data.length-1,current+n));render()}}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('notes').onclick=()=>{document.getElementById('note').hidden=!document.getElementById('note').hidden};document.getElementById('all').onclick=()=>{showAll=!showAll;render()};async function full(){document.body.classList.toggle('present');try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}}document.getElementById('full').onclick=full;document.getElementById('print').onclick=()=>{let prior=showAll;showAll=true;render();window.print();showAll=prior;render()};document.addEventListener('keydown',e=>{if(e.target.matches('button,input,textarea,select'))return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key.toLowerCase()==='n')document.getElementById('notes').click();if(e.key.toLowerCase()==='f')full()});render();
</script><dialog id="imageZoom"><button id="closeZoom">ปิดภาพ</button><img id="zoomImg" alt=""></dialog><script>document.getElementById("screen").addEventListener("click",e=>{if(e.target.matches(".lesson-figure img")){const z=document.getElementById("zoomImg");z.src=e.target.src;z.alt=e.target.alt;document.getElementById("imageZoom").showModal()}});document.getElementById("closeZoom").onclick=()=>document.getElementById("imageZoom").close();</script></body></html>
